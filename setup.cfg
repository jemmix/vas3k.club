[flake8]
# ignore= (not extend-ignore=) replaces pycodestyle's default ignore list, like the original setup did,
# so default-ignored codes (e.g. E24) are enforced here
# unfixed on purpose:
#   E226 — preexisting ignore, spacing around arithmetic operators
#   W503/W504 — mutually exclusive, any wrapped binary operator trips one of them
#   E121/E123/E126 — continuation-indent drift all over legacy code, fixing churns 25+ files for zero behavior change
#   E704 — one-liner defs in tests
#   W391 — blank line at end of file, not worthwhile
ignore = E226,W391,E121,E123,E126,E704,W503,W504
# E501: disable for AI prompts, cleanest way to do it for triple-quoted strings with flake8
# NOTE: ruff allows noqa after the ending triple-quotes, so migrate to that?
# E402: these entrypoints run django.setup() before model imports, on purpose
per-file-ignores =
    ai/moderation.py:E501
    bot/main.py:E402
    bot/tests/test_integration.py:E402
    bot/tests/test_llm.py:E402
    helpdeskbot/main.py:E402
max-line-length = 200
exclude = .venv,scripts,*/migrations/*,frontend/node_modules
max-complexity = 13
