[flake8]
# codes are flake8's only vocabulary (E501 = line-too-long, W391 = blank-line-at-end-of-file, etc.)
# extend-ignore keeps pycodestyle defaults instead of replacing them
extend-ignore = E226,E302,E41,W391
# E501: disable for AI prompts, cleanest way to do it for triple-quoted strings with flake8
# NOTE: ruff allows noqa after the ending triple-quotes, so migrate to that?
# E402: these entrypoints run django.setup() before model imports, on purpose
per-file-ignores =
    ai/moderation.py:E501
    ai/assistant.py:E501
    bot/main.py:E402
    bot/tests/test_integration.py:E402
    bot/tests/test_llm.py:E402
    helpdeskbot/main.py:E402
    notifications/telegram/posts.py:E402
    notifications/telegram/users.py:E402
max-line-length = 200
exclude = .venv,scripts,*/migrations/*,frontend/node_modules
max-complexity = 13
