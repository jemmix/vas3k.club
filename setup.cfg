[flake8]
# extend-ignore keeps pycodestyle defaults (E121,E123,E126,E24,E704,W503,W504) instead of replacing them
extend-ignore = E226,E302,E41
# E501 in ai/: the long lines are inside LLM prompt string literals.
# A per-line "# noqa" would become part of the prompt, so the ignore lives here instead.
per-file-ignores =
    ai/moderation.py:E501
    ai/assistant.py:E501
max-line-length = 120
exclude = .venv,scripts,*/migrations/*,frontend/node_modules
max-complexity = 13
