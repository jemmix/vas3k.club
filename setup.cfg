[flake8]
# extend-ignore keeps pycodestyle defaults (E121,E123,E126,E24,E704,W503,W504) instead of replacing them
# E402: entrypoints (bot/, helpdeskbot/, notifications/telegram/) call django.setup() before imports on purpose
extend-ignore = E226,E302,E41,E402
max-line-length = 120
exclude = .venv,scripts,*/migrations/*,frontend/node_modules
max-complexity = 13
